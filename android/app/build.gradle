plugins {
    id 'com.android.application'
}

def versionCodeProp = (project.findProperty("versionCode") ?: "1").toString().toInteger()
def versionNameProp = (project.findProperty("versionName") ?: "1.0.0").toString()

android {
    namespace 'com.anibeat.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.anibeat.app"
        minSdk 24
        targetSdk 35
        versionCode versionCodeProp
        versionName versionNameProp
        resourceConfigurations += ["ru", "en"]
    }

    signingConfigs {
        release {
            def keystoreFile = rootProject.file("keystore/anibeat-release.jks")
            def propertiesFile = rootProject.file("keystore/keystore.properties")
            if (keystoreFile.exists() && propertiesFile.exists()) {
                def props = new Properties()
                propertiesFile.withInputStream { props.load(it) }
                storeFile keystoreFile
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
            def envStore = System.getenv("ANIBEAT_KEYSTORE_FILE")
            if (envStore != null) {
                storeFile file(envStore)
                storePassword System.getenv("ANIBEAT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANIBEAT_KEY_ALIAS")
                keyPassword System.getenv("ANIBEAT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'

    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}

// Подробный вывод тестов: полный стек и вывод приложения.
tasks.withType(Test).configureEach {
    testLogging {
        events "failed", "skipped"
        showStandardStreams = true
        exceptionFormat "full"
    }
}
