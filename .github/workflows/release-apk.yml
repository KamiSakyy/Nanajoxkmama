name: Build APK

on:
  push:
    branches: [ main, master, "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/ndk /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle build (assembleRelease)
        id: build
        run: |
          set +e
          gradle assembleRelease -PversionCode=$(( ${{ github.run_number }} + 1000 )) -PversionName=2.0.${{ github.run_number }} --no-daemon 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build failed → publish build-errors.txt
        if: steps.build.outputs.exit != '0'
        run: |
          echo "::error::BUILD FAILED — see build-errors.txt"
          grep -E -A2 "error:|FAILURE|What went wrong|e: " build.log | head -120 > build-errors.txt
          echo "----- tail -----" >> build-errors.txt
          tail -60 build.log >> build-errors.txt
          echo "[skip ci]" >> build-errors.txt
          git config user.name "anibeat-ci"
          git config user.email "ci@anibeat.app"
          git add build-errors.txt
          git commit -m "ci: build-errors.txt [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
          exit 1

      - name: Collect artifacts
        if: steps.build.outputs.exit == '0'
        run: |
          rm -f build-errors.txt
          mkdir -p handoff
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" handoff/AniBeat-release.apk
          sha256sum handoff/AniBeat-release.apk | tee handoff/AniBeat-release.sha256
          rm -f handoff/anibeat-sources.zip
          zip -qr handoff/anibeat-sources.zip . -x '*/build/*' 'build/*' '*/.gradle/*' '.gradle/*' 'signing/*' '.git/*' 'handoff/*' '*.apk' '*/.idea/*' '.idea/*'

      - name: Handoff commit [skip ci]
        if: steps.build.outputs.exit == '0'
        run: |
          git config user.name "anibeat-ci"
          git config user.email "ci@anibeat.app"
          git add handoff/AniBeat-release.apk handoff/AniBeat-release.sha256 handoff/anibeat-sources.zip
          git add -u
          git commit -m "release: AniBeat APK + sources [skip ci]" || true
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: Upload APK artifact
        if: steps.build.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: AniBeat-release
          path: |
            handoff/AniBeat-release.apk
            handoff/AniBeat-release.sha256
            handoff/anibeat-sources.zip
