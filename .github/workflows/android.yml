name: android

# Builds the signed APK of the AniBeat Android app (Java + Android SDK) and
# publishes it to handoff/ and to a GitHub Release, then verifies the app on
# a real Android emulator and stores device screenshots (docs/android-screenshots) plus the device logcat (ci-logs/).
on:
  workflow_dispatch:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "android/**"
      - "web/**"
      - "tools/release/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STORE_PASSWORD: ${{ secrets.ANIBEAT_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANIBEAT_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANIBEAT_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Version
        id: v
        run: |
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "name=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Ensure release keystore (stable signing key = installable as an update)
        run: |
          mkdir -p android/keystore
          : "${STORE_PASSWORD:=anibeat-release-2026}"
          : "${KEY_ALIAS:=anibeat}"
          : "${KEY_PASSWORD:=${STORE_PASSWORD}}"
          if [ ! -f android/keystore/anibeat-release.jks ]; then
            keytool -genkeypair -v \
              -keystore android/keystore/anibeat-release.jks \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10950 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=AniBeat, OU=Mobile, O=AniBeat, L=Moscow, C=RU"
          fi
          cat > android/keystore/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          git add -f android/keystore
          git diff --cached --quiet || git -c user.name=anibeat-ci -c user.email=anibeat-ci@users.noreply.github.com commit -q -m "chore(android): release keystore [skip ci]"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (platform 35 + build tools)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package the web app into the APK assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r web/dist/. android/app/src/main/assets/
          ls -la android/app/src/main/assets | head -20

      - name: Gradle 8.9
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> $GITHUB_PATH
          /opt/gradle/gradle-8.9/bin/gradle -v

      - name: Build signed release APK
        id: build
        run: |
          set -o pipefail
          gradle -p android clean assembleRelease --no-daemon \
            -PversionCode=${{ steps.v.outputs.code }} \
            -PversionName=${{ steps.v.outputs.name }} 2>&1 | tee build.log
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Verify signature and alignment
        run: |
          APK="${{ steps.build.outputs.apk }}"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs "$APK" | tee signature.txt
          $BT/zipalign -c -v 4 "$APK" | tail -2
          sha256sum "$APK" | tee apk-sha256.txt
          grep -i "SHA-256" signature.txt | head -2

      - name: Publish to handoff/
        run: |
          set -e
          mkdir -p handoff
          APK="${{ steps.build.outputs.apk }}"
          cp "$APK" handoff/anibeat-release.apk
          cp "$APK" "handoff/AniBeat-${{ steps.v.outputs.name }}.apk"
          {
            echo "AniBeat Android — сборка от $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "версия: ${{ steps.v.outputs.name }} (versionCode ${{ steps.v.outputs.code }})"
            echo "файл: handoff/AniBeat-${{ steps.v.outputs.name }}.apk"
            echo
            echo "SHA-256:"
            cat apk-sha256.txt
            echo
            echo "Подпись:"
            cat signature.txt
          } > handoff/build-info.txt
          cat handoff/build-info.txt

      - name: Commit handoff + release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "anibeat-ci"
          git config user.email "anibeat-ci@users.noreply.github.com"
          git add -f handoff android/keystore
          git commit -m "release(android): AniBeat ${{ steps.v.outputs.name }} (versionCode ${{ steps.v.outputs.code }}) [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q || true
            if git push origin HEAD:${{ github.ref_name }}; then echo "pushed"; break; fi
            sleep 5
          done
          gh release create "v${{ steps.v.outputs.name }}" \
            "handoff/AniBeat-${{ steps.v.outputs.name }}.apk" \
            --title "AniBeat Android ${{ steps.v.outputs.name }}" \
            --notes "Подписанный APK приложения AniBeat (versionCode ${{ steps.v.outputs.code }}). Устанавливается поверх предыдущей версии как обновление. Файл также лежит в папке handoff/ репозитория." \
            || echo "release exists"

      - name: Store the build log (readable from the repository)
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "run: ${{ github.run_id }}  job: build-apk  status: ${{ job.status }}"
            echo "version: ${{ steps.v.outputs.name }}"
            echo
            tail -c 200000 build.log 2>/dev/null || echo "no build.log"
          } > ci-logs/last-build.log
          # Публикуем ошибку сборки как аннотацию — её видно через API даже там, где нет логов.
          if [ "${{ job.status }}" != "success" ]; then
            ERR=$(grep -E "error:|^e: |FAILURE:|What went wrong|Caused by|Execution failed|> " build.log 2>/dev/null | head -60 | tr '\r' ' ' | tr '\n' '~' | sed 's/%/%25/g' | cut -c1-2500)
            echo "::error title=Gradle build output::${ERR}"
            SIG=$(grep -E "^> |error:" build.log 2>/dev/null | head -6 | tr '\n' '~' | sed 's/%/%25/g' | cut -c1-900)
            echo "::warning title=Summary::${SIG}"
          fi
          git add -f ci-logs/last-build.log
          git commit -m "chore(ci): build log [skip ci]" || echo "nothing"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q || true
            if git push origin HEAD:${{ github.ref_name }}; then echo "pushed"; break; fi
            sleep 5
          done

  emulator-check:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run the APK on an Android emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -memory 3072
          script: |
            set -e
            mkdir -p docs/android-screenshots ci-logs
            grep -v "keystore.properties" .gitignore > /tmp/g || true
            set -x
            adb install -r handoff/anibeat-release.apk
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb logcat -c || true
            adb shell am start -W -n com.anibeat.app/.MainActivity || true
            sleep 60

            SIZE=$(adb shell wm size | tr -d '\r' | awk -F': ' '{print $2}')
            W=$(echo "$SIZE" | cut -dx -f1)
            H=$(echo "$SIZE" | cut -dx -f2)
            echo "screen: ${W}x${H}"
            # закрыть служебные диалоги (разрешения), не мешая приложению
            adb shell input keyevent 4 || true
            sleep 5
            adb exec-out screencap -p > docs/android-screenshots/01-home.png

            tab() { adb shell input tap $(( W * ($1 * 2 + 1) / 8 )) $(( H - H * 34 / 1000 )); }
            tab 1; sleep 12; adb exec-out screencap -p > docs/android-screenshots/02-search.png
            tab 2; sleep 12; adb exec-out screencap -p > docs/android-screenshots/03-browse.png
            tab 3; sleep 10; adb exec-out screencap -p > docs/android-screenshots/04-library.png
            tab 0; sleep 12; adb exec-out screencap -p > docs/android-screenshots/05-home-again.png

            # прокрутка главной
            adb shell input swipe $((W / 2)) $((H * 75 / 100)) $((W / 2)) $((H * 35 / 100)) 400 || true
            sleep 6
            adb exec-out screencap -p > docs/android-screenshots/06-home-scrolled.png

            # воспроизведение: кнопка «Слушать» в hero-блоке (позиция фиксирована в раскладке)
            adb shell input swipe $((W / 2)) $((H * 35 / 100)) $((W / 2)) $((H * 80 / 100)) 400 || true
            sleep 3
            adb shell input tap $(( W * 195 / 390 )) $(( H * 296 / 844 )) || true
            sleep 30
            adb exec-out screencap -p > docs/android-screenshots/07-now-playing.png
            adb shell input keyevent 4 || true
            sleep 6
            adb exec-out screencap -p > docs/android-screenshots/08-mini-player.png

            adb logcat -d > ci-logs/emulator-logcat.txt || true
            adb shell dumpsys activity activities > ci-logs/emulator-activity.txt || true
            grep -E "AniBeatBridge|AniBeatPlayback|AniBeat .*error" ci-logs/emulator-logcat.txt | tail -40 || true
            adb shell pidof com.anibeat.app || echo "APP NOT RUNNING"

      - name: Publish device screenshots
        if: always()
        run: |
          git config user.name "anibeat-ci"
          git config user.email "anibeat-ci@users.noreply.github.com"
          ls -la docs/android-screenshots || true
          git add -f docs/android-screenshots
          git commit -m "chore(ci): device screenshots [skip ci]" || echo "nothing"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q || true
            if git push origin HEAD:${{ github.ref_name }}; then echo "pushed"; break; fi
            sleep 5
          done
